# =============================================================================
# Demucster — docker compose (production)
# =============================================================================
# Requires: NVIDIA Container Toolkit (nvidia-ctk)
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# Usage:
#   docker compose up --build        # Build and start
#   docker compose up -d             # Detached
#   docker compose logs -f demucster # Follow logs
# =============================================================================

services:
  demucster:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demucster
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - demucster-data:/data
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - DEFAULT_MODEL=htdemucs_ft
      - DEVICE=cuda
      - REQUIRE_CUDA=true
      - MAX_CONCURRENT_JOBS=2
      - RETENTION_HOURS=24
      - OUTPUT_FORMAT=mp3
      - MP3_BITRATE=320
      - LOG_LEVEL=INFO
      - PREWARM_MODEL=true
      - LYRICS_ENABLED=true
      - LYRICS_DEFAULT_MODEL=large-v3-turbo
      - LYRICS_PREWARM_MODEL=false
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:27b
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen("http://localhost:8000/api/v1/health", timeout=5));
          assert data["status"] == "healthy" and data["cuda_available"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # Initial model download and warmup can take several minutes

volumes:
  demucster-data:
    driver: local

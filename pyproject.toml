[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demucster"
version = "0.1.0"
description = "GPU-accelerated audio stem separation microservice powered by Demucs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Demucster Team" }]
keywords = ["demucs", "audio", "stem-separation", "gpu", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.12",
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "demucs>=4.0.0",
    "soundfile>=0.12.0",
    "ffmpeg-python>=0.2.0",
    "yt-dlp>=2024.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/demucster"]

# ---------------------------------------------------------------------------
# uv — PyTorch CUDA 12.8 index for Blackwell (sm_12x) kernel support
# ---------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]
ignore = [
    "A003",   # builtin shadowing on class attributes (e.g. `id`)
    "B008",   # function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["demucster"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["demucster"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
